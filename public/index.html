<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Web Crawler</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <div class="controls">
    <h1>Web Crawler</h1>

    <label>Adres startowy:</label>
    <input id="url" value="https://www.zsmonki.pl/">

    <label>Metoda:</label>
    <select id="method">
      <option value="0">BFS</option>
      <option value="1">DFS</option>
    </select>

    <label>Maksymalna głębokość:</label>
    <input type="number" id="depth" value="2">

    <label>Czas działania (sekundy):</label>
    <input type="number" id="time" value="10">

    <label>Max dzieci:</label>
    <input type="number" id="children" value="10">

    <button onclick="start()">Start</button>
    <a class="csv" href="/csv" target="_blank">Pobierz CSV</a>
  </div>

  <div id="tree"></div>
</div>


<script>
async function start() {
    treeDiv.innerHTML = "";
    const res = await fetch("/crawl", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            startUrl: url.value,
            method: Number(method.value),
            maxDepth: Number(depth.value),
            timeLimit: Number(time.value),
            maxChildren: Number(children.value)
        })
    });

    const tree = await res.json();
    console.log(tree.visited)
    treeDiv.innerHTML = "";
    treeDiv.appendChild(printTree(tree.visited));
    // treeDiv.textContent = print(tree.visited);
}

function printTree(node, depth = 0) {
    const wrapper = document.createElement("div");
    wrapper.className = "node";
    wrapper.style.setProperty("--depth", depth);

    const label = document.createElement("a");
    label.className = "node-label";
    label.href = node.url;
    label.textContent = node.url;
    label.target = "_blank";        // open in new tab
    label.rel = "noopener noreferrer";

    wrapper.appendChild(label);

    if (node.children?.length) {
        const children = document.createElement("div");
        children.className = "children";

        node.children.forEach(child =>
        children.appendChild(printTree(child, depth + 1))
        );

        wrapper.appendChild(children);
    }

    return wrapper;
}


const treeDiv = document.getElementById("tree");
</script>

</body>
</html>
